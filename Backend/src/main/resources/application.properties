
# ==========================================
# SubscribeIQ - Spring Boot Configuration
# ==========================================

# Application Name
spring.application.name=subscribeiq-backend

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/subscription_billing_db
spring.datasource.username=root
spring.datasource.password=Sansansan@24
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JSON Configuration
# ==========================================
spring.jackson.serialization.indent-output=true

# ==========================================
# CORS Configuration
# ==========================================
# Controller-level @CrossOrigin is already configured.

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.subscribeiq.backend=DEBUG

# Display registered API endpoint mappings
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Display SQL queries
logging.level.org.hibernate.SQL=DEBUG
